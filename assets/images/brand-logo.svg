<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <style>
      .logotype { font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; font-weight: 900; }
      .barbell { fill: #E54D42; }
      .kanji { fill: #F5F5F5; }
      .text-color { fill: #F5F5F5; }
    </style>
  </defs>

  <!-- Gym Icon Group (Centered horizontally) -->
  <g transform="translate(120, 95)">
    <!-- Connecting Bar -->
    <rect x="-62" y="-6" width="124" height="12" rx="2" class="barbell" />

    <!-- Center Hexagon Core -->
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17" class="barbell" stroke="#E54D42" stroke-width="4" stroke-linejoin="round" />

    <!-- Left Weights (Large inside, Small outside) -->
    <rect x="-48" y="-26" width="10" height="52" rx="4" class="barbell" />
    <rect x="-58" y="-20" width="8" height="40" rx="3" class="barbell" />

    <!-- Right Weights (Large inside, Small outside) -->
    <rect x="38" y="-26" width="10" height="52" rx="4" class="barbell" />
    <rect x="50" y="-20" width="8" height="40" rx="3" class="barbell" />

    <!-- Core Kanji -->
    <text x="0" y="12" class="logotype kanji" font-size="34" text-anchor="middle">筋</text>
  </g>

  <!-- App Brand Name -->
  <text x="120" y="160" class="logotype text-color" font-size="28" letter-spacing="3" text-anchor="middle">筋トレノート</text>
</svg>
